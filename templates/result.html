<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Results</title>
    <style>
        :root { --primary: #2e7d32; --secondary: #4caf50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        
        .result-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 15px; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        h2 { color: #333; margin-top: 0; }
        
        .result-card { background: #f9f9f9; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .top-1 { background: #e8f5e9; border: 1px solid var(--secondary); }
        .top-1 .label { color: var(--primary); font-size: 20px; font-weight: bold; }
        .top-1 .score { background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-weight: bold; }
        
        .other-results { font-size: 14px; color: #666; }
        
        .btn-back { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #666; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-back:hover { background: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Classification Result</h2>
        
        <!-- Relative path from static folder -->
        <img src="{{ url_for('static', filename='uploads/' + img_filename) }}" class="result-img" alt="Analyzed Image">

        <div class="results-container">
            {% for item in results %}
                <div class="result-card {{ 'top-1' if loop.first else 'other-results' }}">
                    <span class="label">{{ item.class | capitalize }}</span>
                    <span class="score">{{ item.conf }}%</span>
                </div>
            {% endfor %}
        </div>

        <a href="/" class="btn-back">Try Another Image</a>
    </div>
</body>
</html>
