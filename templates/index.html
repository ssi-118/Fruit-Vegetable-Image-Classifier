<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit & Vegetable Classifier</title>
    <style>
        :root { --primary: #2e7d32; --secondary: #4caf50; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h1 { color: var(--primary); margin-bottom: 10px; font-size: 24px; }
        p { color: #666; margin-bottom: 30px; }
        
        #drop-area {
            border: 3px dashed #ccc;
            border-radius: 15px;
            padding: 40px 20px;
            transition: 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
            position: relative;
        }
        #drop-area.highlight { border-color: var(--secondary); background: #e8f5e9; }
        #drop-area p { margin: 0; font-weight: bold; color: #888; }
        
        input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        
        .btn { background: var(--primary); color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background: var(--secondary); transform: translateY(-2px); }

        .loader { display: none; margin: 20px auto; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .preview-img { max-width: 100%; border-radius: 10px; display: none; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FreshCheck AI</h1>
        <p>Upload a fruit or vegetable image to classify</p>
        
        <form action="/predict" method="post" enctype="multipart/form-data" id="upload-form">
            <div id="drop-area">
                <p id="instruction-text">Drag & drop or click to select</p>
                <img id="image-preview" class="preview-img" src="#" alt="Preview">
                <input type="file" name="file" id="file-input" accept="image/*" required onchange="previewFile()">
            </div>
            <button type="submit" class="btn" onclick="showLoading()">Analyze Image</button>
        </form>

        <div id="loader" class="loader"></div>
        <p id="loading-text" style="display:none; color: var(--primary); font-weight: bold;">Processing Image...</p>
    </div>

    <script>
        function previewFile() {
            const preview = document.getElementById('image-preview');
            const file = document.getElementById('file-input').files[0];
            const text = document.getElementById('instruction-text');
            const reader = new FileReader();

            reader.onloadend = function () {
                preview.src = reader.result;
                preview.style.display = "block";
                text.style.display = "none";
            }
            if (file) { reader.readAsDataURL(file); }
        }

        function showLoading() {
            const fileInput = document.getElementById('file-input');
            if(fileInput.files.length > 0) {
                document.getElementById('loader').style.display = "block";
                document.getElementById('loading-text').style.display = "block";
            }
        }

        // Drag and drop highlight
        const dropArea = document.getElementById('drop-area');
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('highlight'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('highlight'), false);
        });
    </script>
</body>
</html>
